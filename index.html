<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Talon Tropical — Prueba de movimiento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-wrap">
    <div class="rotate-tip" aria-live="polite">↻<span>Gira el celular para jugar en horizontal</span></div>
    <canvas id="game" aria-label="Prototipo jugable de Talon Tropical"></canvas>
    <button id="fullscreen" type="button" aria-label="Activar pantalla completa" title="Pantalla completa">⛶</button>
    <div class="hint">A/D o ←/→ caminar · Ctrl + dirección correr · Espacio/W/↑ saltar</div>
    <div class="touch-controls" aria-label="Controles táctiles">
      <div class="left-controls"><div class="dpad"><button data-key="ArrowLeft" aria-label="Izquierda">◀</button><button data-key="ArrowRight" aria-label="Derecha">▶</button></div><button class="run" data-key="ControlLeft" aria-label="Correr">➤<small>Correr</small></button></div>
      <div class="actions"><div class="secondary"><button class="crouch" data-key="ArrowDown" aria-label="Agacharse">⌄<small>Agachar</small></button><button class="sword" data-key="KeyE" aria-label="Sacar espada">⚔<small>Espada</small></button></div><div class="primary"><button class="attack" data-key="KeyX" aria-label="Atacar">✦<small>Atacar</small></button><button class="jump" data-key="Space" aria-label="Saltar o subir">↑<small>Saltar</small></button></div><button class="climb" data-key="ArrowUp" aria-label="Subir al borde" hidden>↑<small>Subir</small></button></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
